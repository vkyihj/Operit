# 工作流名称
name: Android APK Build

# 触发条件：推送到 main 或 master 分支，或手动触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # 运行在最新的 Ubuntu 环境
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码：升级到 v5，支持 Node.js 24
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. 设置 Java 环境：升级到 v5，支持 Node.js 24
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置 Android SDK：保持 v3（目前最新），仍可正常工作
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. 赋予 gradlew 执行权限（如果项目中有该文件）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 【核心】编译仅包含 armeabi-v7a 的 Debug 版 APK
      - name: Build APK (armeabi-v7a only)
        run: |
          ./gradlew assembleDebug -Pandroid.injected.build.abi=armeabi-v7a

      # 6. 上传编译产物
      - name: Upload APK
        uses: actions/upload-artifact@v4   # v4 仍受支持，无需升级
        with:
          name: app-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/*.apk