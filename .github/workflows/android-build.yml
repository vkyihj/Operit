name: Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 自动修复：注释掉有问题的 :terminal 依赖
      - name: Auto-fix build.gradle
        run: |
          if [ -f "app/build.gradle" ]; then
            # 备份原文件（可选）
            cp app/build.gradle app/build.gradle.bak
            # 在每行以 implementation project(':terminal') 开头的行首添加注释 //
            sed -i '/implementation project(:terminal)/s/^/\/\/ /' app/build.gradle
            echo "✅ 已注释掉 terminal 依赖"
          else
            echo "⚠️ app/build.gradle 不存在，跳过修复"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (armeabi-v7a only)
        run: |
          ./gradlew assembleDebug -Pandroid.injected.build.abi=armeabi-v7a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/*.apk